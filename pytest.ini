[pytest]
# Chỉ gom test thật trong tests/.
#
# tools/ có 8 file tên `test_*.py` NHƯNG không phải pytest — chúng là script
# chẩn đoán chạy tay, phần lớn cần server đang chạy ở 127.0.0.1:5000. Nếu ai đó
# gõ `pytest` trần ở thư mục gốc, pytest sẽ gom nhầm và fail/treo.
testpaths = tests

norecursedirs = .git .venv venv __pycache__ .pytest_cache node_modules models data output results tools

addopts = -q
