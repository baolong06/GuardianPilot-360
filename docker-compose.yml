services:
  guardianpilot:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SAVE_FACE_SNAPSHOTS=false
      - ALLOW_RULE_ONLY_MODE=true
      # edge = tiết kiệm CPU/RAM (5 FPS infer, tắt LSTM, 256×192)
      # - EDGE_PROFILE=edge
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./results:/app/results:ro
      - ./output:/app/output
    restart: unless-stopped
