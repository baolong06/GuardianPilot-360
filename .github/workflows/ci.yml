name: CI

on:
  push:
    branches: [main, Long, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # Skip heavy TF/MediaPipe model download for pure unit tests of scoring/perclos/etc.
          # Fusion integration tests that need keras mocks still run without real models.

      - name: Run unit tests
        run: |
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/test_eye_closure_rule.py \
            --ignore=tests/test_perclos_integration.py
        # Full suite (with mock keras) can be enabled when CI has enough deps:
        # python -m pytest tests/ -q --tb=short
